            if (xhr.status < 500) {
              // Received a non-500 response, application is ready

              // Still getting 5xx errors, wait 5 seconds and check again
              setTimeout(checkApplicationStatus, 5000);

        };

        xhr.ontimeout = function () {
          // Request timed out, wait 5 seconds and check again
          setTimeout(checkApplicationStatus, 5000);
        };

        xhr.onerror = function () {
          // Error occurred, wait 5 seconds and check again
          setTimeout(checkApplicationStatus, 5000);
        };

        // Add cache-busting parameter to avoid cached responses
        xhr.send();

        setTimeout(checkApplicationStatus, 5000);
